name: release

# Pushing a `v*` tag does two things:
#   1. publish to npm (trusted publishing over OIDC — no NPM_TOKEN secret)
#   2. create the matching GitHub Release, notes taken from CHANGELOG.md
#
# One-time setup on npmjs.com (package → Settings → Trusted publishing):
#   publisher: GitHub Actions
#   organization/user: zztmercury
#   repository:        pbmockx
#   workflow filename: release.yml
#   environment:       (leave empty)
#
# Manual runs (`workflow_dispatch`) default to dry-run: checks + pack, no upload,
# no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run checks and pack, but do not publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token: npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Deliberately no registry-url / NODE_AUTH_TOKEN: trusted publishing
          # exchanges the GitHub OIDC token for a short-lived npm credential.

      - name: Toolchain versions
        run: node -v && npm -v

      - name: Require npm >= 11.5.1 (trusted publishing)
        run: |
          set -eu
          have="$(npm -v)"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$have" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $have is too old; trusted publishing needs npm >= 11.5.1"
            exit 1
          fi

      - name: Check version consistency
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="$(node -p "require('./package.json').version")"
          echo "VERSION=$version package.json=$pkg ref=$GITHUB_REF_NAME type=$GITHUB_REF_TYPE"
          if [ "$version" != "$pkg" ]; then
            echo "::error::VERSION ($version) and package.json version ($pkg) differ"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$version"
            exit 1
          fi
          # Fails before anything is published, so a tag can never ship without notes.
          node scripts/changelog-notes.js --check

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::refusing to publish from a $GITHUB_REF_TYPE ref ($GITHUB_REF_NAME); push a v* tag"
            exit 1
          fi
          if npm view "pbmockx@$version" version >/dev/null 2>&1; then
            echo "::warning::pbmockx@$version is already published — skipping upload"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: npm publish --dry-run"
            npm publish --dry-run
          else
            echo "publishing pbmockx@$version"
            npm publish --provenance
          fi

  github-release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-notes.js --out "$RUNNER_TEMP/notes.md"

      - name: Add notes to job summary
        run: |
          set -eu
          {
            echo "### v$(tr -d '[:space:]' < VERSION)"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$(tr -d '[:space:]' < VERSION)"
          if url="$(gh release view "$tag" --json url --jq .url 2>/dev/null)"; then
            echo "::notice::release $tag already exists — leaving it untouched ($url)"
            exit 0
          fi
          case "$tag" in
            *-*) flags="--prerelease" ;; # e.g. v1.2.0-beta.1
            *)   flags="" ;;
          esac
          # gh prints the new release URL on success; its exit status is the check.
          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $flags
