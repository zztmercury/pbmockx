<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>PBView - Response</title>
<style>
  :root {
    --pb-bg: #fafafa;
    --pb-text: #333;
    --pb-muted: #999;
    --pb-error: #c00;
    --pb-border: #e8e8e8;
    --pb-hover: #eef5ff;
    --pb-toggle: #bbb;
    --pb-field-name: #006;
    --pb-field-number: #aaa;
    --pb-field-type: #070;
    --pb-value: #d00;
    --pb-string: #a00;
    --pb-number: #00a;
    --pb-enum: #707;
    --pb-bytes: #750;
    --pb-unset: #bbb;
    --pb-message-border: #eee;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --pb-bg: #1b1b1b;
      --pb-text: #d4d4d4;
      --pb-muted: #8a8a8a;
      --pb-error: #ff6060;
      --pb-border: #333;
      --pb-hover: #1c2840;
      --pb-toggle: #6a6a6a;
      --pb-field-name: #6db4ff;
      --pb-field-number: #7a7a7a;
      --pb-field-type: #7eda7e;
      --pb-value: #ff6060;
      --pb-string: #ff7a7a;
      --pb-number: #6db4ff;
      --pb-enum: #d99cd9;
      --pb-bytes: #d4a86a;
      --pb-unset: #6a6a6a;
      --pb-message-border: #2a2a2a;
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--pb-bg); min-height:100%; }
  body { font-family:'SF Mono','Monaco','Menlo','Consolas',monospace; font-size:12px; background:var(--pb-bg); color:var(--pb-text); line-height:1.6; }
  #container { padding:6px 8px; }
  .hint { color:var(--pb-muted); padding:12px; text-align:center; }
  .error { color:var(--pb-error); padding:12px; }
  .tree-node { margin-left:0; }
  .tree-children { margin-left:12px; border-left:1px solid var(--pb-border); padding-left:6px; }
  .field-row { padding:1px 0; cursor:default; white-space:nowrap; }
  .field-row.expandable { cursor:pointer; }
  .field-row.expandable:hover { background:var(--pb-hover); }
  .toggle { display:inline-block; width:12px; color:var(--pb-toggle); user-select:none; }
  .fname { color:var(--pb-field-name); font-weight:500; }
  .fnum { color:var(--pb-field-number); font-size:10px; }
  .ftype { color:var(--pb-field-type); font-style:italic; font-size:11px; opacity:0.7; }
  .fval { color:var(--pb-value); }
  .fval.s { color:var(--pb-string); }
  .fval.n { color:var(--pb-number); }
  .fval.e { color:var(--pb-enum); }
  .fval.b { color:var(--pb-bytes); }
  .unset { color:var(--pb-unset); font-style:italic; }
  .collapsed>.tree-children { display:none; }
  .collapsed>.field-row .toggle::before { content:'▸'; }
  .expanded>.field-row .toggle::before { content:'▾'; }
  .msg-hdr { font-weight:bold; padding:2px 0 3px; margin-bottom:3px; border-bottom:1px solid var(--pb-message-border); }
  .loading { color:var(--pb-muted); padding:12px; }
</style>
</head>
<body>
<div id="container"><div class="hint" id="placeholder">Select a request to view Protobuf data</div></div>
<script>window.__PBMOCKX_MODE='res';</script>
<script src="pb-view.js"></script>
</body>
</html>
